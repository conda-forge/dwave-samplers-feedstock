{% set name = "dwave-samplers" %}
{% set version = "1.8.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/dwavesystems/dwave-samplers/archive/refs/tags/{{ version }}.tar.gz
  sha256: 2bd30a06c7363c7c28e74dfd1e5d56b9e41068904ab7a1752369b16f3bd219cd

build:
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - cython >=3.2                           # [build_platform != target_platform]
    - numpy                                  # [build_platform != target_platform]
    - dimod >=0.12.21,<0.13.0                # [build_platform != target_platform]
    - {{ compiler('cxx') }}
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - meson >=1.3
    - ninja
    - pkg-config
  host:
    - python
    - pip
    - meson-python
    - cython >=3.2
    - numpy
    - dimod >=0.12.21,<0.13.0
  run:
    - numpy >=1.21.6,<3.0.0
    - python
    - dimod >=0.12.21,<0.13.0
    - networkx >=3,<4

test:
  imports:
    - dwave
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/dwavesystems/dwave-samplers
  summary: Ocean-compatible collection of solvers/samplers
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - BastianZim
